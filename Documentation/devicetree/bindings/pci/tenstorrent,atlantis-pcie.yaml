%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/tenstorrent,atlantis-pcie.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Tenstorrent Atlantis PCIe host controller

maintainers:
  - Drew Fustini <fustini@kernel.org>

description:
  The Atlantis SoC has three PCIe Root Complex controllers (x16, x8 and x4)
  based on the Synopsys DesignWare PCIe IP, so they inherit the common
  properties defined in snps,dw-pcie.yaml. The controllers share a PCIe
  subsystem register block which holds their resets, clock gates and the
  AXI sideband that distinguishes DBI accesses from outbound TLPs.

allOf:
  - $ref: /schemas/pci/pci-host-bridge.yaml#
  - $ref: /schemas/pci/snps,dw-pcie.yaml#

properties:
  compatible:
    const: tenstorrent,atlantis-pcie

  reg:
    minItems: 3
    items:
      - description: Data Bus Interface (DBI) registers
      - description: Outbound window for the peripheral configuration space
      - description: Controller application registers
      - description: iATU registers

  reg-names:
    minItems: 3
    items:
      - const: dbi
      - const: config
      - const: app
      - const: atu

  clocks:
    items:
      - description: AXI clock of the controller's master and slave interfaces
      - description: APB clock of the application registers
      - description: Auxiliary clock of the controller's power management logic
      - description: APB clock of the PHY control registers

  clock-names:
    items:
      - const: slv
      - const: pclk
      - const: aux
      - const: phy_reg

  resets:
    items:
      - description: Controller reset
      - description: Application registers reset
      - description: PHY control block reset

  reset-names:
    items:
      - const: core
      - const: app
      - const: phy

  interrupts:
    minItems: 1
    maxItems: 2

  interrupt-names:
    minItems: 1
    items:
      - const: msi
      - const: dma

  interrupt-controller:
    description:
      Interrupt controller node for the INTx interrupts. The node needs its
      own interrupt-parent, because the parent PCIe node's interrupt-cells
      belong to its interrupt-map.
    type: object

    properties:
      "#address-cells":
        const: 0

      "#interrupt-cells":
        const: 1

      interrupt-controller: true

      interrupts:
        items:
          - description: Combined INTx interrupt

    required:
      - "#address-cells"
      - "#interrupt-cells"
      - interrupt-controller
      - interrupts

    additionalProperties: false

  msi-parent: true

  reset-gpios:
    description: GPIO driving the slot PERST# signal.
    maxItems: 1

  tenstorrent,sysreg:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: phandle to the PCIe subsystem register block
          - description: index of this controller within the subsystem
            maximum: 2
    description:
      The PCIe subsystem register block shared by the three controllers,
      and the index selecting this controller's registers within it.

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - resets
  - reset-names
  - interrupt-controller
  - tenstorrent,sysreg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      pcie@30000000000 {
        compatible = "tenstorrent,atlantis-pcie";
        reg = <0x300 0x00000000 0x0 0x01000000>,
              <0x300 0x01000000 0x0 0x10000000>,
              <0x000 0xd9800000 0x0 0x00800000>;
        reg-names = "dbi", "config", "app";
        #address-cells = <3>;
        #size-cells = <2>;
        device_type = "pci";
        bus-range = <0x00 0xff>;
        linux,pci-domain = <2>;
        num-lanes = <4>;
        ranges = <0x81000000 0x000 0x00000000 0x300 0x11000000 0x00 0x00100000>,
                 <0x82000000 0x000 0x80000000 0x300 0x80000000 0x00 0x80000000>,
                 <0xc3000000 0x301 0x00000000 0x301 0x00000000 0xfe 0x80000000>;
        clocks = <&prcm 12>, <&prcm 15>, <&prcm 25>, <&prcm 19>;
        clock-names = "slv", "pclk", "aux", "phy_reg";
        resets = <&prcm 44>, <&prcm 52>, <&prcm 49>;
        reset-names = "core", "app", "phy";
        interrupts = <109 IRQ_TYPE_LEVEL_HIGH>, <114 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "msi", "dma";
        msi-parent = <&imsic>;
        reset-gpios = <&gpio 15 GPIO_ACTIVE_LOW>;
        tenstorrent,sysreg = <&pcie_sysreg 2>;
        dma-coherent;

        interrupt-controller {
          #address-cells = <0>;
          #interrupt-cells = <1>;
          interrupt-controller;
          interrupt-parent = <&aplic>;
          interrupts = <110 IRQ_TYPE_LEVEL_HIGH>;
        };
      };
    };
...
